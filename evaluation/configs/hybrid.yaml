# Qdrant 벡터 검색 + Neo4j 그래프 확장 타깃으로 검색 품질을 잰다.
#
# 이 설정은 앞선 세 설정과 달리 실행 중인 데이터베이스를 요구한다. 연결
# 상태는 `linkpaper-eval bench doctor`로 먼저 확인한다. DB 없이 돌리려면
# `--target baseline`으로 바꾸면 같은 데이터셋을 BM25로 평가한다.
#
# 코퍼스가 Qdrant/Neo4j에 적재되어 있어야 한다:
#   linkpaper-eval bench prepare --name qasper
#   linkpaper-eval bench seed --name qasper --collection linkpaper_eval_qasper

suite: retrieval
dataset: datasets/retrieval/sample.jsonl

target:
  type: graphrag_hybrid
  options:
    top_k: 10
    citation_count: 3
    # BM25 베이스라인과 같은 값을 쓴다. 라우팅 판정 규칙을 맞춰야
    # routing.accuracy를 두 타깃 사이에서 비교할 수 있다.
    routing_threshold: 0.45
    graph_expansion: true
    graph_hops: 1
    expansion_papers: 5
    qdrant:
      url: ${QDRANT_URL:-http://localhost:6333}
      collection: ${QDRANT_COLLECTION:-linkpaper_chunks}
    neo4j:
      uri: ${NEO4J_URI:-bolt://localhost:7687}
      username: ${NEO4J_USERNAME:-neo4j}
      password: ${NEO4J_PASSWORD:-linkpaper-password}
    embedding:
      # 인덱스를 만들 때 쓴 것과 반드시 같아야 한다. 다르면 벡터 차원이
      # 어긋나거나, 차원이 같아도 의미 공간이 달라 점수가 무의미해진다.
      provider: ${LINKPAPER_EMBEDDING_PROVIDER:-hash}
      model: ${LINKPAPER_EMBEDDING_MODEL:-text-embedding-3-small}

targets:
  baseline:
    type: lexical_baseline
    options:
      corpus: fixtures/mock_corpus.jsonl
      top_k: 10
      routing_threshold: 0.45
  hybrid:
    type: graphrag_hybrid
    options:
      top_k: 10
      citation_count: 3
      routing_threshold: 0.45
      graph_expansion: true
  vector:
    type: vector_rag
    options:
      top_k: 10
  vector_retrieval:
    # 그래프 확장을 끈 대조군. 두 결과의 차이가 그래프가 실제로 기여한
    # 몫이다. GraphRAG를 쓰는 근거를 숫자로 보여 주는 비교다.
    type: graphrag_hybrid
    options:
      top_k: 10
      citation_count: 3
      routing_threshold: 0.45
      graph_expansion: false

k_values: [1, 3, 5, 10]

baseline: baselines/hybrid-retrieval.json

# 게이트는 비워 둔다. 실제 분포를 확인하기 전에 기준을 정하면 의미 없는
# 숫자가 CI를 막는다. 몇 번 실행해 본 뒤 configs/retrieval.yaml처럼 채운다.
gates: {}

run:
  concurrency: 4
  output_dir: runs
