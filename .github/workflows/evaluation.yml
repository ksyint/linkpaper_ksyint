name: evaluation

# 평가 디렉터리와 이 워크플로 자체가 바뀔 때만 실행한다. 다른 팀원의 PR을
# 막지 않기 위한 의도적인 경로 제한이다. 백엔드 변경에도 평가를 돌리려면
# paths에 `backend/**`를 추가하면 된다.
on:
  push:
    branches: ["**"]
    paths:
      - "evaluation/**"
      - ".github/workflows/evaluation.yml"
  pull_request:
    paths:
      - "evaluation/**"
      - ".github/workflows/evaluation.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: evaluation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stores를 함께 설치한다. Qdrant 임베디드 모드 테스트가 클라이언트
      # API 변경(예: search -> query_points)을 잡아 주는데, 드라이버가 없으면
      # 조용히 skip되어 의미가 없어진다.
      - name: Install
        run: pip install -e '.[dev,stores]'

      - name: Unit and integration tests
        run: pytest -q

  # 벤치마크 준비와 평가셋 생성 경로가 조용히 깨지는 것을 막는다.
  # 오프라인 픽스처와 결정적 생성기만 쓰므로 API 키와 DB가 필요 없다.
  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Prepare local benchmark
        run: linkpaper-eval bench prepare --name linkpaper-local

      - name: Run local benchmark
        run: |
          linkpaper-eval bench run \
            --name linkpaper-local --suite retrieval \
            --run-id bench-${{ github.run_number }} --quiet

      # 생성 결과 검증에 실패하면 종료 코드 1로 워크플로가 멈춘다.
      - name: Generate testset offline
        run: |
          linkpaper-eval testgen \
            --source jsonl --corpus fixtures/mock_corpus.jsonl \
            --engine offline --size 20 \
            --out runs/generated-${{ github.run_number }}.jsonl

      - name: Regenerate from frozen snapshot
        run: |
          linkpaper-eval testgen-regenerate \
            --manifest runs/generated-${{ github.run_number }}.manifest.json \
            --out runs/regenerated-${{ github.run_number }}.jsonl
          cmp runs/generated-${{ github.run_number }}.jsonl runs/regenerated-${{ github.run_number }}.jsonl

  ragas-contract:
    runs-on: ubuntu-latest
    env:
      RAGAS_DO_NOT_TRACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ragas and store adapters
        run: pip install -e '.[dev,stores,ragas]'
      - name: Real Ragas algorithms with scripted providers
        run: pytest -q tests/test_ragas_generation.py tests/test_ragas_metrics.py tests/test_vector_rag.py tests/test_synthetic_pipeline.py

  ontology-contract:
    runs-on: ubuntu-latest
    env:
      LINKPAPER_TEST_DOCKER_NEO4J: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation and production schema dependencies
        run: pip install -e '.[dev,stores]' 'pydantic-settings>=2.9,<3' 'langchain-text-splitters>=0.3,<0.4'
      - name: Production indexer to isolated Neo4j
        run: pytest -q tests/test_ontology_integration.py

  evaluate:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        suite: [retrieval, generation, extraction]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      # 오프라인 베이스라인 타깃이라 API 키와 실행 중인 서비스가 필요 없다.
      # 게이트 미달이면 종료 코드 1로 워크플로가 실패한다.
      - name: Run ${{ matrix.suite }} suite
        run: |
          linkpaper-eval run \
            --config configs/${{ matrix.suite }}.yaml \
            --run-id ci-${{ github.run_number }} \
            --quiet

      - name: Summary
        if: always()
        run: |
          report="runs/ci-${{ github.run_number }}/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.suite }}-${{ github.run_number }}
          path: evaluation/runs/ci-${{ github.run_number }}/
          retention-days: 14
